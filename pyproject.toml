[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-adsb"
version = "0.1.0"
description = "Portable ADS-B receiver and aircraft tracking application for PocketTerm"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.50",
    "rich>=13.0",
    "requests>=2.31",
    "airportsdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pocket-adsb = "pocket_adsb.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pocket_adsb"]